name: RBAC Scope Hardening
on:
  push:
    paths:
      - .github/workflows/rbac-scope-hardening.yml
permissions:
  contents: write
jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Harden scope matcher
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/services/rbac.js')
          s = p.read_text()
          start = s.index('export function isRegionVisible')
          end = s.index('function scopeRootTypes', start)
          replacement = '''export function isRegionVisible(access, region) {
  if (!access?.loaded || !access?.profile?.is_active) return false;
  if (access.role?.name === "super_admin" || (access.permissions || []).includes("*")) return true;
  if (!region) return false;
  const scopes = Array.isArray(access.scopes) ? access.scopes : [];
  if (!scopes.length) return false;
  const hierarchy = region.hierarchy || {};
  const norm = (v) => normalizeRegionName(v);
  const eq = (a, b) => a != null && b != null && String(a) === String(b);
  const nameEq = (a, b) => Boolean(a && b && norm(a) === norm(b));
  const regionType = String(hierarchy.type || region.type || "").trim().toLowerCase();
  const regionId = region.id == null ? null : String(region.id);
  const regionName = region.name || region.properties?.name || "";
  for (const scope of scopes) {
    const countryId = scope.country_id == null ? null : String(scope.country_id);
    const provinceId = scope.province_id == null ? null : String(scope.province_id);
    const districtId = scope.district_id == null ? null : String(scope.district_id);
    if (!countryId && !provinceId && !districtId) return true;
    if (districtId) {
      if (eq(hierarchy.districtId, districtId) || eq(hierarchy.district_id, districtId) || eq(regionId, districtId)) return true;
      if (nameEq(hierarchy.districtName, scope.district_name) || (nameEq(regionName, scope.district_name) && ["district","districts","ilce","ilçe"].includes(regionType))) return true;
      continue;
    }
    if (provinceId) {
      if (eq(hierarchy.provinceId, provinceId) || eq(hierarchy.province_id, provinceId) || eq(regionId, provinceId)) return true;
      if (nameEq(hierarchy.provinceName, scope.province_name) || (nameEq(regionName, scope.province_name) && ["province","provinces","il"].includes(regionType))) return true;
      continue;
    }
    if (countryId) {
      if (eq(hierarchy.countryId, countryId) || eq(hierarchy.country_id, countryId) || eq(regionId, countryId)) return true;
      if (nameEq(hierarchy.countryName, scope.country_name) || (nameEq(regionName, scope.country_name) && ["country","countries","ülke"].includes(regionType))) return true;
    }
  }
  return false;
}
'''
          p.write_text(s[:start] + replacement + s[end:])
          PY
          rm -f .github/workflows/rbac-scope-hardening.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/services/rbac.js .github/workflows/rbac-scope-hardening.yml
          git commit -m 'fix: enforce strict RBAC geographic scopes'
          git push
