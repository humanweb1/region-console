name: RBAC Scope Patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$COMMIT_MESSAGE" == *"fix(rbac): normalize scoped action targets"* ]]; then exit 0; fi
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/features/regions/region-actions.js')
          s = p.read_text()
          old = 'function regionScope(region) { const hierarchy = region?.hierarchy || {}; return { countryId: hierarchy.countryId || null, provinceId: hierarchy.provinceId || null, districtId: hierarchy.districtId || null }; }'
          new = '''function regionScope(region) {
            const hierarchy = region?.hierarchy || {};
            const type = String(hierarchy.type || region?.type || '').toLowerCase();
            return {
              countryId: type === 'country' ? (region?.id || hierarchy.countryId || null) : (hierarchy.countryId || null),
              provinceId: type === 'province' ? (region?.id || hierarchy.provinceId || null) : (hierarchy.provinceId || null),
              districtId: type === 'district' ? (region?.id || hierarchy.districtId || null) : (hierarchy.districtId || null)
            };
          }'''
          if old in s: p.write_text(s.replace(old, new, 1))
          else: print('regionScope already patched or target missing')

          p = Path('src/services/rbac.js')
          s = p.read_text()
          start = s.find('export function hasScope(access, target = {}) {')
          end = s.find('\nfunction catalogRegionId', start)
          if start < 0 or end < 0: raise SystemExit('hasScope boundaries not found')
          new_fn = '''export function hasScope(access, target = {}) {
            if (!access?.loaded || !access?.profile?.is_active) return false;
            if (access.role?.name === "super_admin" || (access.permissions || []).includes("*")) return true;
            const scopes = access.scopes || [];
            if (!scopes.length) return false;
            const catalog = access.regionCatalog || [];
            const resolve = (value, type) => {
              if (value == null || !String(value) || !type) return null;
              return scopeCatalogMatch(catalog, value, type);
            };
            const targetCountry = resolve(target.countryId, "country");
            const targetProvince = resolve(target.provinceId, "province");
            const targetDistrict = resolve(target.districtId, "district");
            return scopes.some((scope) => {
              const scopeCountry = resolve(scope.country_id, "country");
              const scopeProvince = resolve(scope.province_id, "province");
              const scopeDistrict = resolve(scope.district_id, "district");
              if (!scopeCountry && !scopeProvince && !scopeDistrict) return true;
              if (scopeDistrict) return Boolean(targetDistrict && String(scopeDistrict.id) === String(targetDistrict.id));
              if (scopeProvince) return Boolean(targetProvince && String(scopeProvince.id) === String(targetProvince.id));
              if (scopeCountry) {
                if (targetDistrict) {
                  let cursor = targetDistrict;
                  while (cursor) {
                    if (String(cursor.id) === String(scopeCountry.id)) return true;
                    cursor = cursor.parent_id ? catalog.find((row) => String(row.id) === String(cursor.parent_id)) : null;
                  }
                  return false;
                }
                if (targetProvince) return String(targetProvince.parent_id) === String(scopeCountry.id);
                return Boolean(targetCountry && String(targetCountry.id) === String(scopeCountry.id));
              }
              return false;
            });
          }
'''
          p.write_text(s[:start] + new_fn + s[end:])
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/features/regions/region-actions.js src/services/rbac.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(rbac): normalize scoped action targets'
          git push