name: RBAC Scope Fix

on:
  push:
    paths:
      - '.github/workflows/rbac-scope-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'fix(rbac): normalize scoped action targets') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch scope resolution
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/features/regions/region-actions.js')
          s = p.read_text()
          old = 'function regionScope(region) { const hierarchy = region?.hierarchy || {}; return { countryId: hierarchy.countryId || null, provinceId: hierarchy.provinceId || null, districtId: hierarchy.districtId || null }; }'
          new = '''function regionScope(region) {
            const hierarchy = region?.hierarchy || {};
            const type = String(hierarchy.type || region?.type || '').toLowerCase();
            return {
              countryId: type === 'country' ? (region?.id || hierarchy.countryId || null) : (hierarchy.countryId || null),
              provinceId: type === 'province' ? (region?.id || hierarchy.provinceId || null) : (hierarchy.provinceId || null),
              districtId: type === 'district' ? (region?.id || hierarchy.districtId || null) : (hierarchy.districtId || null)
            };
          }'''
          if old not in s:
              raise SystemExit('regionScope target not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('src/services/rbac.js')
          s = p.read_text()
          pattern = r"export function hasScope\(access, target = \{\}\) \{.*?\n\}\n\nfunction catalogRegionId"
          replacement = '''export function hasScope(access, target = {}) {
            if (!access?.loaded || !access?.profile?.is_active) return false;
            if (access.role?.name === "super_admin" || (access.permissions || []).includes("*")) return true;
            const scopes = access.scopes || [];
            if (!scopes.length) return false;
            const catalog = access.regionCatalog || [];
            const resolveTarget = (value, type) => {
              if (value == null || !String(value) || !type) return null;
              return scopeCatalogMatch(catalog, value, type);
            };
            const country = resolveTarget(target.countryId, "country");
            const province = resolveTarget(target.provinceId, "province");
            const district = resolveTarget(target.districtId, "district");
            const targetCountry = country?.id ? String(country.id) : null;
            const targetProvince = province?.id ? String(province.id) : null;
            const targetDistrict = district?.id ? String(district.id) : null;
            return scopes.some((scope) => {
              const scopeCountry = resolveTarget(scope.country_id, "country");
              const scopeProvince = resolveTarget(scope.province_id, "province");
              const scopeDistrict = resolveTarget(scope.district_id, "district");
              if (!scopeCountry && !scopeProvince && !scopeDistrict) return true;
              if (scopeDistrict) return Boolean(targetDistrict && String(scopeDistrict.id) === targetDistrict);
              if (scopeProvince) return Boolean(targetProvince && String(scopeProvince.id) === targetProvince);
              if (scopeCountry) {
                if (targetDistrict) {
                  let cursor = catalog.find((row) => String(row.id) === targetDistrict);
                  while (cursor?.parent_id) {
                    if (String(cursor.parent_id) === String(scopeCountry.id)) return true;
                    cursor = catalog.find((row) => String(row.id) === String(cursor.parent_id));
                  }
                  return false;
                }
                if (targetProvince) {
                  const provinceRow = catalog.find((row) => String(row.id) === targetProvince);
                  return Boolean(provinceRow && String(provinceRow.parent_id) === String(scopeCountry.id));
                }
                return Boolean(targetCountry && targetCountry === String(scopeCountry.id));
              }
              return false;
            });
          }

          function catalogRegionId'''
          ns, count = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('hasScope target not found')
          p.write_text(ns)
          PY
      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/features/regions/region-actions.js src/services/rbac.js
          git diff --cached --quiet && exit 0
          git commit -m 'fix(rbac): normalize scoped action targets'
          git push

# trigger