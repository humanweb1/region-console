name: Patch RBAC hierarchy name matching

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, 'fix: resolve scoped hierarchy aliases')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch hierarchy visibility
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/services/rbac.js')
          s = p.read_text()
          old = '''function visibleCatalogMatch(catalog, visible, value, type = null) {
  if (value == null || !String(value)) return false;
  const normalized = String(value);
  const match = catalog.find((item) => {
    if (type && String(item.type) !== String(type)) return false;
    return catalogRegionId(item) === normalized || catalogExternalId(item) === normalized;
  });
  return Boolean(match && visible.has(catalogRegionId(match)));
}'''
          new = '''function normalizeRegionName(value) {
  return String(value ?? "").trim().toLocaleLowerCase("tr-TR")
    .replace(/ı/g, "i").replace(/ğ/g, "g").replace(/ü/g, "u")
    .replace(/ş/g, "s").replace(/ö/g, "o").replace(/ç/g, "c");
}

function visibleCatalogMatch(catalog, visible, value, type = null, name = null) {
  const normalized = value == null ? "" : String(value);
  const normalizedName = normalizeRegionName(name);
  if (!normalized && !normalizedName) return false;
  const match = catalog.find((item) => {
    if (type && String(item.type) !== String(type)) return false;
    if (normalized && (catalogRegionId(item) === normalized || catalogExternalId(item) === normalized)) return true;
    return Boolean(normalizedName && normalizeRegionName(item.name) === normalizedName);
  });
  return Boolean(match && visible.has(catalogRegionId(match)));
}'''
          if old not in s:
              raise SystemExit('visibleCatalogMatch target not found')
          s = s.replace(old, new, 1)
          old2 = '''  const parentValues = [
    [hierarchy.parentId, hierarchy.parentType || null],
    [hierarchy.provinceId, "province"],
    [hierarchy.districtId, "district"],
    [hierarchy.countryId, "country"]
  ];
  if (parentValues.some(([value, type]) => visibleCatalogMatch(catalog, visible, value, type))) return true;'''
          new2 = '''  const parentValues = [
    [hierarchy.parentId, hierarchy.parentType || null, hierarchy.parentName],
    [hierarchy.provinceId, "province", hierarchy.provinceName],
    [hierarchy.districtId, "district", hierarchy.districtName],
    [hierarchy.countryId, "country", hierarchy.countryName]
  ];
  if (parentValues.some(([value, type, name]) => visibleCatalogMatch(catalog, visible, value, type, name))) return true;'''
          if old2 not in s:
              raise SystemExit('parentValues target not found')
          p.write_text(s.replace(old2, new2, 1))
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/services/rbac.js
          git diff --cached --quiet && exit 0
          git commit -m 'fix: resolve scoped hierarchy aliases'
          git push
      - name: Remove patch workflow
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/patch-rbac-hierarchy-names.yml
          git add .github/workflows/patch-rbac-hierarchy-names.yml
          git commit -m 'chore: remove one-time hierarchy patch workflow'
          git push
