name: RBAC Contract Fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rbac-contract-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.event.head_commit.message != 'fix(rbac): align management service signatures' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch service contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/services/rbac.js')
          s=p.read_text()
          a='export async function updateUser(accessToken, payload) { return request("/functions/v1/admin-rbac", accessToken, { method: "POST", body: JSON.stringify({ action: "update-user", ...payload }) }); }'
          b='export async function updateUser(accessToken, userIdOrPayload, maybePayload) {\n  const payload = maybePayload === undefined ? userIdOrPayload : { user_id: userIdOrPayload, ...(maybePayload || {}) };\n  return request("/functions/v1/admin-rbac", accessToken, { method: "POST", body: JSON.stringify({ action: "update-user", ...(payload || {}) }) });\n}'
          c='export async function updateRole(accessToken, payload) { return request("/functions/v1/admin-rbac", accessToken, { method: "POST", body: JSON.stringify({ action: "update-role", ...payload }) }); }'
          d='export async function updateRole(accessToken, roleIdOrPayload, maybePayload) {\n  const payload = maybePayload === undefined ? roleIdOrPayload : { role_id: roleIdOrPayload, ...(maybePayload || {}) };\n  return request("/functions/v1/admin-rbac", accessToken, { method: "POST", body: JSON.stringify({ action: "update-role", ...(payload || {}) }) });\n}'
          if a not in s or c not in s: raise SystemExit('targets not found')
          p.write_text(s.replace(a,b).replace(c,d))
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/services/rbac.js
          git commit -m 'fix(rbac): align management service signatures'
          git push
