name: RBAC Contract Fix
on:
  push:
    paths:
      - '.github/workflows/rbac-contract-fix.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix RBAC service contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/services/rbac.js')
          s = p.read_text()
          old = 'export async function updateUser(accessToken, payload) { return request("/functions/v1/admin-rbac", accessToken, { method: "POST", body: JSON.stringify({ action: "update-user", ...payload }) }); }\nexport async function createRole(accessToken, payload) { return request("/functions/v1/admin-rbac", accessToken, { method: "POST", body: JSON.stringify({ action: "create-role", ...payload }) }); }\nexport async function updateRole(accessToken, payload) { return request("/functions/v1/admin-rbac", accessToken, { method: "POST", body: JSON.stringify({ action: "update-role", ...payload }) }); }'
          new = 'export async function updateUser(accessToken, userIdOrPayload, maybePayload) { const payload = maybePayload === undefined ? userIdOrPayload : { user_id: userIdOrPayload, ...(maybePayload || {}) }; return request("/functions/v1/admin-rbac", accessToken, { method: "POST", body: JSON.stringify({ action: "update-user", ...(payload || {}) }) }); }\nexport async function createRole(accessToken, payload) { return request("/functions/v1/admin-rbac", accessToken, { method: "POST", body: JSON.stringify({ action: "create-role", ...payload }) }); }\nexport async function updateRole(accessToken, roleIdOrPayload, maybePayload) { const payload = maybePayload === undefined ? roleIdOrPayload : { role_id: roleIdOrPayload, ...(maybePayload || {}) }; return request("/functions/v1/admin-rbac", accessToken, { method: "POST", body: JSON.stringify({ action: "update-role", ...(payload || {}) }) }); }'
          if old not in s:
              raise SystemExit('expected RBAC service contract not found')
          p.write_text(s.replace(old, new))
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/services/rbac.js
          git diff --cached --quiet || git commit -m 'fix: normalize RBAC service payload contract'
          git push
