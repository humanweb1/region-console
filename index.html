<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>Region Console</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <link rel="stylesheet" href="./src/styles/base.css">
  <link rel="stylesheet" href="./src/styles/shell.css">
  <link rel="stylesheet" href="./src/styles/sidebar.css">
  <link rel="stylesheet" href="./src/styles/map.css">
  <link rel="stylesheet" href="./src/styles/panels.css">
</head>
<body>
  <div id="app" class="app" aria-live="polite">
    <section id="loginView" class="login-view" hidden></section>
    <section id="consoleView" class="console-view" hidden>
      <header class="topbar">
        <div class="topbar-menu">
          <button id="menuButton" class="icon-button menu-button" type="button" aria-label="Menüyü aç" aria-expanded="false" aria-controls="headerMenu" title="Menü"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
          <div id="headerMenu" class="header-menu" hidden>
            <button id="campaignButton" class="header-menu-item" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14v12H5zM8 7V5h8v2M9 11h6M9 15h4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Kampanyalar</span></button>
            <button id="usersButton" class="header-menu-item" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M6 19c.7-3 2.6-4.5 6-4.5s5.3 1.5 6 4.5M17 5.5a2.5 2.5 0 0 1 0 5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg><span>Kullanıcılar</span></button>
            <button id="filesButton" class="header-menu-item" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5h6l2 2h8v10H4z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M8 13h8M8 16h5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span>Dosyalar</span></button>
          </div>
        </div>
        <div class="brand"><strong>Region Console</strong></div>
        <label class="search"><span class="sr-only">Bölge ara</span><input id="regionSearch" type="search" placeholder="Bölge ara..." autocomplete="off"><div id="headerSearchResults" class="header-search-results" hidden></div></label>
        <div class="topbar-actions"><span id="cloudStatus" class="cloud-status">Bulut hazırlanıyor…</span><span id="versionLabel" class="version">v0.1.0</span><button id="themeButton" class="icon-button" type="button" aria-label="Tema" title="Tema değiştir"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 15.2A8.4 8.4 0 0 1 8.8 3.5 8.5 8.5 0 1 0 20.5 15.2Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button><button id="logoutButton" class="button button-light" type="button">Çıkış</button></div>
      </header>
      <main class="workspace">
        <button id="regionsToggle" class="regions-toggle" type="button" aria-expanded="false" aria-controls="sidebar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5h16M4 12h16M4 17.5h10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span>Bölgeler</span><svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 9 5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <aside id="sidebar" class="sidebar" aria-label="Bölgeler" hidden>
          <div class="sidebar-head"><h1>Bölgeler</h1><button id="addRegionButton" class="icon-button" type="button" aria-label="Bölge ekle" title="Bölge ekle">+</button></div>
          <div id="regionTree" class="region-tree"></div>
          <div class="legend"><div><i class="dot dot-service"></i> Hizmet Verilen</div><div><i class="dot dot-outside"></i> Hizmet Dışı</div><div><i class="dot dot-custom"></i> Özel Alan</div></div>
        </aside>
        <section class="map-stage">
          <div id="map" class="map" role="application" aria-label="Bölge haritası"></div>
          <aside class="tool-panel" aria-label="Araçlar">
            <button class="tool active" data-tool="draw" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19 19 5M5 19h5M14 5h5v5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Çizim</span></button>
            <button class="tool" data-tool="edit" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 16 8-8 4 4-8 8H4v-4ZM14 6l2-2 4 4-2 2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Düzenle</span></button>
            <button class="tool" data-tool="delete" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M9 7V4h6v3m-8 0 1 13h8l1-13M10 11v5m4-5v5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg><span>Sil</span></button>
            <button class="tool" data-tool="import" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4m0 0-4 4m4-4 4 4M5 13v6h14v-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span>İçe aktar</span></button>
            <button class="tool" data-tool="export" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 14v6h14v-6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Dışa aktar</span></button>
            <button class="tool" data-tool="history" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.7L4 8.5M4 4v4.5h4.5M12 7v5l3 2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg><span>Geçmiş</span></button>
          </aside>
          <div class="map-controls" aria-label="Harita kontrolleri"><button id="resetMapButton" class="icon-button" type="button" aria-label="Haritayı sıfırla" title="Haritayı sıfırla">↻</button><button id="mapLayerButton" class="map-layer active" type="button">Harita</button><button id="satelliteLayerButton" class="map-layer" type="button">Uydu</button><button id="zoomOutButton" class="icon-button" type="button" aria-label="Uzaklaştır" title="Uzaklaştır">−</button><button id="zoomInButton" class="icon-button" type="button" aria-label="Yakınlaştır" title="Yakınlaştır">+</button></div>
          <div id="editBar" class="edit-bar" hidden><button id="undoButton" class="button" type="button">↶ Geri al</button><button id="redoButton" class="button" type="button">↷ İleri al</button><span class="selection-info">Çizim <strong id="selectedArea">0 nokta</strong></span><label class="status-select"><span>Durum</span><select id="areaStatus"><option value="service">● Hizmet Verilen</option><option value="outside">● Hizmet Dışı</option></select></label><button id="saveButton" class="button button-primary" type="button">Kaydet</button></div>
          <footer class="stats"><span>Toplam Ülke: <b id="statCountries">0</b></span><span>Toplam İl: <b id="statProvinces">0</b></span><span>Toplam İlçe: <b id="statDistricts">0</b></span><span>Toplam Alan: <b id="statArea">0</b></span><span>Hizmet Verilen: <b id="statService">0</b></span><span>Hizmet Dışı: <b id="statOutside">0</b></span></footer>
        </section>
      </main>
    </section>
    <dialog id="appDialog" class="app-dialog"><header class="dialog-header"><h2 id="dialogTitle">Region Console</h2><button id="dialogClose" class="icon-button" type="button" aria-label="Kapat">×</button></header><div id="dialogBody" class="dialog-body"></div></dialog>
    <div id="toast" class="toast" role="status" hidden></div>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="./src/core/runtime-config.js"></script>
  <script type="module" src="./src/features/regions/region-manager.js"></script>
  <script type="module" src="./src/features/regions/region-import-dialog.js"></script>
  <script type="module" src="./src/core/app.js"></script>
  <script type="module" src="./src/features/files/files.js"></script>
  <script type="module" src="./src/features/settings/map-settings.js"></script>
  <script type="module" src="./src/features/regions/region-actions.js"></script>
  <script type="module" src="./src/features/search/header-search.js"></script>
  <script type="module" src="./src/features/map/layers-ui.js"></script>
</body>
</html>
